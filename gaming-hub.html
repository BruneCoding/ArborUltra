<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="dark">
        <title>Arbor Gaming Hub</title>
        <style>
            :root {
                --accent: #d7df1f;
                --bg: #0a0a0a;
                --glass: rgba(20,22,17,.88)
            }

            *,*::before,*::after {
                box-sizing: border-box
            }

            html,body {
                margin: 0;
                min-height: 100%;
                background: var(--bg);
                color: #fff;
                font-family: "Google Sans","Segoe UI",Roboto,Arial,sans-serif;
                -webkit-font-smoothing: antialiased
            }

            body {
                overflow-x: hidden
            }

            button {
                font: inherit;
                color: inherit
            }

            p {
                margin: 0
            }

            *::-webkit-scrollbar {
                display: none
            }

            * {
                scrollbar-width: none
            }

            .icon {
                display: inline-block;
                flex: none;
                width: 1em;
                height: 1em;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round
            }

            .hub {
                display: grid;
                grid-template-columns: minmax(0,1.6fr) minmax(0,1fr) 190px;
                gap: 22px;
                align-items: start;
                padding: 20px 8px 56px
            }

            .col {
                display: flex;
                flex-direction: column;
                gap: 16px;
                min-width: 0
            }

            /* FIX: keep the left column (and its popover) above the middle column */
            .col-left {
                position: relative;
                z-index: 5
            }

            .greeting {
                height: 56px;
                display: flex;
                align-items: flex-end;
                padding: 0 4px
            }

            .greeting-line {
                font-size: 25px;
                font-weight: 650;
                letter-spacing: -.8px;
                white-space: nowrap
            }

            .greeting-name {
                color: var(--accent);
                font-weight: 750;
                text-shadow: 0 0 18px #d7df1f20
            }

            .ss-card {
                position: relative;
                z-index: 5;
                width: 100%;
                aspect-ratio: 1738/700;
                min-height: 240px;
                overflow: visible;
                isolation: isolate;
                border-radius: 40px;
                background: #181a09;
                box-shadow: 0 18px 55px #0003
            }

            .ss-background {
                position: absolute;
                inset: 0;
                z-index: -4;
                width: 100%;
                height: 100%;
                border-radius: inherit;
                object-fit: cover;
                opacity: .87
            }

            .ss-background-wash {
                position: absolute;
                inset: 0;
                z-index: -3;
                border-radius: inherit;
                background: linear-gradient(90deg,#141604f0 0%,#141604d1 25%,#14160491 45%,#14160424 68%,transparent),linear-gradient(0deg,#0c0e0366,transparent 40%)
            }

            .ss-background-vignette {
                position: absolute;
                inset: 0;
                z-index: -2;
                border-radius: inherit;
                box-shadow: inset 0 0 80px #0003,inset 0 1px 0 #ffffff12
            }

            .ss-ambient {
                position: absolute;
                z-index: -1;
                width: 36%;
                aspect-ratio: 1;
                border-radius: 50%;
                filter: blur(65px);
                opacity: .13;
                background: var(--accent);
                animation: drift 12s ease-in-out infinite alternate;
                pointer-events: none
            }

            .ss-ambient-one {
                top: -35%;
                left: 8%
            }

            .ss-ambient-two {
                right: 18%;
                bottom: -50%;
                opacity: .09;
                animation-delay: -5s
            }

            @keyframes drift {
                to {
                    transform: translate(8%,7%) scale(1.13)
                }
            }

            .ss-character {
                position: absolute;
                z-index: 0;
                right: 0;
                bottom: 0;
                height: 110%;
                max-width: 60%;
                object-fit: contain;
                object-position: right bottom;
                transform: translate(-4.5%,6%) scale(1.03);
                filter: drop-shadow(0 10px 30px #0007) brightness(.8) saturate(.9);
                pointer-events: none
            }

            /* FIX: container-type moved here (not on .ss-card) so it no longer traps the
   position:fixed mobile popover inside the card */
            .ss-content {
                position: absolute;
                inset: 0;
                z-index: 2;
                display: flex;
                padding: 5% 0 5% 5%;
                pointer-events: none;
                container-type: inline-size
            }

            .ss-copy {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                width: 50%;
                height: 100%;
                min-width: 0;
                align-items: flex-start
            }

            .ss-logo {
                width: 76%;
                max-height: 38%;
                object-fit: contain;
                object-position: left center;
                filter: drop-shadow(0 5px 12px #0003)
            }

            .ss-description {
                width: 84%;
                font-size: clamp(11px,2.1cqw,15px);
                line-height: 1.45;
                color: #ffffffdf;
                text-shadow: 0 2px 8px #0006
            }

            .ss-actions {
                position: relative;
                z-index: 20;
                display: flex;
                align-items: center;
                gap: 1.6cqw;
                pointer-events: auto
            }

            .fx {
                --mx: 50%;
                --my: 50%;
                position: relative;
                isolation: isolate;
                overflow: hidden;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #e1eb5f4d;
                border-radius: 999px;
                background: radial-gradient(circle at var(--mx) var(--my),#d7df1f22,transparent 65%),linear-gradient(135deg,#ffffff18,#ffffff05);
                box-shadow: inset 0 1px 0 #ffffff30,0 5px 18px #0004;
                backdrop-filter: blur(18px) saturate(145%);
                cursor: pointer;
                text-decoration: none;
                transition: .25s ease
            }

            .fx:hover {
                border-color: #ebf27ab8;
                box-shadow: inset 0 1px 0 #ffffff3d,0 8px 28px #0005,0 0 22px #d7df1f20;
                transform: translateY(-2px)
            }

            .fx:active {
                transform: scale(.975)
            }

            .ss-play {
                gap: 10px;
                padding: 12px 24px 12px 16px;
                font-size: clamp(12px,2.1cqw,17px);
                font-weight: 650;
                white-space: nowrap
            }

            .ss-play svg {
                width: 19px;
                height: 19px;
                color: #e6ed83
            }

            .ss-map-trigger {
                gap: 9px;
                padding: 12px 15px;
                font-size: clamp(11px,1.9cqw,15px);
                opacity: .9;
                white-space: nowrap
            }

            .ss-map-trigger svg {
                width: 17px;
                height: 17px;
                color: #e0e77c
            }

            .ss-map-chevron {
                transition: transform .25s ease
            }

            .ss-map-trigger[aria-expanded=true] .ss-map-chevron {
                transform: rotate(180deg)
            }

            /* ---------- 3D destination picker ---------- */
            .globe-popover {
                position: absolute;
                top: calc(100% + 30px);
                left: 5%;
                z-index: 500;
                width: min(680px,calc(100vw - 32px));
                padding: 15px;
                border: 1px solid #ffffff1c;
                border-radius: 25px;
                background: rgba(10,13,12,.94);
                box-shadow: 0 24px 80px #000b,inset 0 1px 0 #ffffff12;
                backdrop-filter: blur(28px) saturate(135%);
                transform-origin: top left;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transform: translateY(-7px) scale(.985);
                transition: opacity .22s cubic-bezier(.22,1,.36,1),transform .28s cubic-bezier(.22,1,.36,1),visibility .28s
            }

            .globe-popover.is-open {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateY(0) scale(1)
            }

            .globe-popover[hidden] {
                display: none
            }

            .globe-heading {
                position: relative;
                z-index: 3;
                display: flex;
                align-items: center;
                gap: 8px;
                height: 30px;
                padding: 0 4px;
                pointer-events: none
            }

            .globe-heading .icon {
                width: 18px;
                height: 18px;
                color: var(--accent);
                filter: drop-shadow(0 0 8px #d7df1f55)
            }

            .globe-heading strong {
                font-size: 15px;
                font-weight: 650;
                letter-spacing: -.3px
            }

            /* Globe stage: no border, no background, no shadow, no clipping.
   It overlaps the heading and pokes out of the top of the popup. */
            .globe-stage {
                position: relative;
                z-index: 2;
                height: 350px;
                margin: -74px -15px 0;
                overflow: visible;
                background: none;
                border: 0;
                border-radius: 0;
                box-shadow: none;
                outline: 0;
                cursor: grab;
                touch-action: none;
                isolation: isolate;
                -webkit-tap-highlight-color: transparent
            }

            .globe-stage:active {
                cursor: grabbing
            }

            #earth-canvas {
                margin-top: 40px;
                display: block;
                width: 100%;
                height: 100%;
                background: none;
                border: 0;
                outline: 0
            }

            .globe-hover-label {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 8;
                transform: translate(-50%,-125%);
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 6px 10px;
                border: 1px solid #ffffff20;
                border-radius: 99px;
                background: rgba(8,11,9,.88);
                backdrop-filter: blur(12px);
                color: #fff;
                font-size: 11px;
                white-space: nowrap;
                pointer-events: none;
                opacity: 0;
                transition: opacity .14s cubic-bezier(.22,1,.36,1)
            }

            .globe-hover-label .icon {
                width: 12px;
                height: 12px;
                color: var(--accent)
            }

            .globe-hover-label.show {
                opacity: 1
            }

            .globe-place-card {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 7;
                transform: translate(-50%,-110%) scale(.97);
                width: 180px;
                overflow: hidden;
                border: 1px solid #ffffff24;
                border-radius: 14px;
                background: rgba(8,11,10,.88);
                backdrop-filter: blur(18px);
                box-shadow: 0 10px 35px #0009;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity .18s cubic-bezier(.22,1,.36,1),transform .22s cubic-bezier(.22,1,.36,1),visibility .22s
            }

            .globe-place-card.show {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%,-110%) scale(1)
            }

            .globe-place-card img {
                display: block;
                width: 100%;
                height: 88px;
                object-fit: cover;
                background: #17201b
            }

            .globe-place-copy {
                padding: 9px 11px 11px
            }

            .globe-place-copy strong {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 13px;
                font-weight: 700;
                margin-bottom: 4px
            }

            .globe-place-copy strong .icon {
                width: 13px;
                height: 13px;
                color: var(--accent)
            }

            .globe-place-copy p {
                font-size: 10px;
                line-height: 1.4;
                color: #ffffffa8
            }

            .globe-controls {
                position: absolute;
                right: 24px;
                bottom: 22px;
                z-index: 12;
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 5px;
                border: 1px solid #ffffff20;
                border-radius: 999px;
                background: rgba(8,12,10,.62);
                backdrop-filter: blur(18px) saturate(140%);
                opacity: .6;
                transform: translateY(3px);
                transition: opacity .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1);
                pointer-events: auto;
                cursor: default
            }

            .globe-stage:hover .globe-controls,.globe-controls:focus-within {
                opacity: 1;
                transform: translateY(0)
            }

            .globe-control-btn {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 7px 11px;
                border: 0;
                border-radius: 999px;
                background: transparent;
                color: #ffffffc9;
                font-size: 11px;
                white-space: nowrap;
                cursor: pointer;
                transition: background .18s,color .18s
            }

            .globe-control-btn .icon {
                width: 13px;
                height: 13px
            }

            .globe-control-btn:hover {
                background: #ffffff13;
                color: #fff
            }

            .globe-control-btn.active {
                background: #d7df1f;
                color: #171906;
                font-weight: 700
            }

            .globe-control-btn.active .icon {
                animation: spin 3s linear infinite
            }

            .globe-divider {
                height: 1px;
                background: #ffffff12;
                margin: 12px 0
            }

            .poki-row {
                position: relative;
                z-index: 3;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px
            }

            .poki-info {
                display: flex;
                align-items: center;
                gap: 10px
            }

            .poki-icon {
                width: 30px;
                height: 30px;
                border-radius: 9px;
                display: grid;
                place-items: center;
                overflow: hidden;
                background: #ffffff10
            }

            .poki-icon img,.poki-icon svg {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

            .poki-info strong {
                display: block;
                font-size: 12px
            }

            .poki-select {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 14px;
                border-radius: 99px;
                border: 1px solid #ffffff20;
                background: #ffffff0b;
                font-size: 11px;
                cursor: pointer;
                transition: background .18s,color .18s
            }

            .poki-select .icon {
                width: 13px;
                height: 13px
            }

            .poki-select:hover {
                background: #ffffff18
            }

            .poki-select.active {
                background: #d7df1f;
                color: #171906;
                border-color: #d7df1f;
                font-weight: 750
            }

            /* ---------- Game mode cards ---------- */
            .modes {
                display: flex;
                flex-direction: column;
                gap: 22px
            }

            .mode {
                position: relative;
                display: block;
                width: 100%;
                height: 92px;
                padding: 0;
                border: 0;
                border-radius: 28px;
                background: #181a09;
                text-align: left;
                overflow: hidden;
                cursor: pointer;
                box-shadow: 0 10px 30px #0004
            }

            .mode-bg,.mode-art-bg,.mode-wash {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border-radius: inherit
            }

            .mode-bg {
                overflow: visible;
            }

            .mode-art-bg {
                object-fit: cover;
                opacity: .9
            }

            .mode-wash {
                background: linear-gradient(90deg,#0e1004dd,#0e100499 45%,#0e10041f),linear-gradient(0deg,#080a0259,transparent 55%)
            }

            .mode-text {
                position: absolute;
                z-index: 3;
                top: 0;
                bottom: 0;
                left: 7%;
                right: 30%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 5px;
                pointer-events: none
            }

            .mode-title {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 17px;
                font-weight: 650;
                letter-spacing: -.3px;
                text-shadow: 0 2px 8px #0008
            }

            .mode-sub {
                font-size: 12px;
                color: #ffffffa8
            }

            .mode-arrow {
                width: 15px;
                height: 15px;
                color: #ffffff99;
                stroke-width: 2.2;
                transition: transform .2s,color .2s
            }

            .mode:hover .mode-arrow {
                transform: translateX(4px);
                color: var(--accent)
            }

            /* Multiplayer: pill card, characters spread across the right, Jake pops out the top */
            .mode-multi {
                overflow: visible;
                border-radius: 30px;
                background: transparent;
                box-shadow: none
            }

            .mode-multi .mode-bg {
                background: radial-gradient(ellipse at 100% 0%,#8a2b2a66,transparent 60%),radial-gradient(ellipse at 45% 100%,#2a3a3a55,transparent 65%),#12130f
            }

            .mode-multi .mode-bg::after {
                content: "";
                position: absolute;
                inset: 0;
                border: 1px solid #ffffff1f;
                border-radius: inherit;
                pointer-events: none
            }

            .mode-multi .mode-art-bg {
                opacity: .55
            }

            .mode-multi .mode-wash {
                background: linear-gradient(90deg,#0b0c08f2 0%,#0b0c08cc 28%,#0b0c0855 55%,#0b0c0833 100%)
            }

            .mode-multi .mode-text {
                left: 10.5%;
                right: auto
            }

            .mode-crowd {
                position: absolute;
                inset: 0;
                z-index: 2;
                pointer-events: none;
                /* clip the sides and bottom to the pill, but let heads overflow the top */
                clip-path: inset(-45% 0 0 0 round 0 0 30px 30px)
            }

            .mode-char {
                position: absolute;
                bottom: -4%;
                width: auto;
                transform: translateX(-50%);
                filter: drop-shadow(0 4px 8px #0008);
                pointer-events: none
            }

            .mode-char.is-jake {
                bottom: -3%;
                filter: drop-shadow(0 6px 10px #000a)
            }

            .mode-horror .mode-text {
                left: 36%;
                right: auto
            }

            .mode-train {
                position: absolute;
                right: -7%;
                bottom: -6px;
                height: 114%;
                width: auto;
                max-width: 53%;
                object-fit: contain
            }

            .mode-jake {
                position: absolute;
                z-index: 1;
                left: -6%;
                bottom: -30px;
                height: 138%;
                width: auto;
                pointer-events: none;
                filter: drop-shadow(0 6px 10px #0009)
            }

            .game-loader {
                position: fixed;
                inset: 0;
                z-index: 999999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #050603c2;
                backdrop-filter: blur(20px);
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: .3s
            }

            .game-loader.active {
                opacity: 1;
                visibility: visible;
                pointer-events: auto
            }

            .game-loader-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px
            }

            .game-loader-spinner {
                width: 38px;
                height: 38px;
                border: 2px solid #d7df1f20;
                border-top-color: var(--accent);
                border-right-color: #d7df1f8c;
                border-radius: 50%;
                animation: spin .8s linear infinite;
                filter: drop-shadow(0 0 9px #d7df1f4d)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }

            .game-loader-title {
                font-size: 15px;
                font-weight: 650
            }

            .game-loader-subtitle {
                font-size: 11px;
                color: #ffffff70
            }

            .game-loader-bar {
                width: 110px;
                height: 2px;
                background: #ffffff17;
                overflow: hidden;
                border-radius: 9px
            }

            .game-loader-bar:after {
                content: "";
                display: block;
                width: 40%;
                height: 100%;
                background: var(--accent);
                animation: load 1s ease-in-out infinite
            }

            @keyframes load {
                to {
                    transform: translateX(280%)
                }
            }

            @media(max-width: 1100px) {
                .hub {
                    grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)
                }

                .col-side {
                    display: none
                }
            }

            @media(max-width: 760px) {
                .hub {
                    grid-template-columns:1fr;
                    gap: 12px;
                    padding: 12px 8px 40px
                }

                .greeting {
                    height: 48px
                }

                .greeting-line {
                    font-size: 21px
                }

                .ss-card {
                    border-radius: 25px
                }

                .ss-content {
                    padding: 6% 0 6% 5%
                }

                .ss-copy {
                    width: 61%
                }

                .ss-logo {
                    width: 85%
                }

                .ss-description {
                    width: 92%
                }

                .ss-play {
                    padding: 10px 17px 10px 12px;
                    gap: 7px
                }

                .ss-map-trigger {
                    gap: 6px;
                    padding: 10px 11px
                }

                .ss-actions {
                    gap: 8px
                }

                .ss-character {
                    max-width: 57%
                }

                .globe-popover {
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%,-50%);
                    width: calc(100vw - 24px);
                    max-width: 560px;
                    animation: mobilepop .2s ease
                }

                .globe-stage {
                    height: min(56vh,400px);
                    margin-top: -60px
                }

                .globe-controls {
                    right: 18px;
                    bottom: 14px
                }

                .modes {
                    gap: 20px
                }

                @keyframes mobilepop {
                    from {
                        opacity: 0;
                        transform: translate(-50%,-47%) scale(.97)
                    }

                    to {
                        opacity: 1;
                        transform: translate(-50%,-50%) scale(1)
                    }
                }
            }

            @media(prefers-reduced-motion:reduce) {
                *,*::before,*::after {
                    animation-duration: .01ms!important;
                    animation-iteration-count: 1!important;
                    transition-duration: .01ms!important
                }
            }

            @media(max-width: 760px) {
                .globe-popover.is-open {
                    transform:translate(-50%,-50%)
                }
            }
        </style>
    </head>
    <body>
        <!-- SVG icon sprite -->
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-pin" viewBox="0 0 24 24">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                <circle cx="12" cy="10" r="3"/>
            </symbol>
            <symbol id="i-rotate" viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
                <path d="M21 3v5h-5"/>
            </symbol>
            <symbol id="i-shuffle" viewBox="0 0 24 24">
                <path d="M16 3h5v5"/>
                <path d="M4 20 21 3"/>
                <path d="M21 16v5h-5"/>
                <path d="m15 15 6 6"/>
                <path d="m4 4 5 5"/>
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="m5 12.5 4.5 4.5L19 7.5"/>
            </symbol>
            <symbol id="i-chevron-right" viewBox="0 0 24 24">
                <path d="m9 6 6 6-6 6"/>
            </symbol>
        </svg>
        <div class="game-loader" id="game-loader" aria-hidden="true">
            <div class="game-loader-content">
                <div class="game-loader-spinner"></div>
                <div class="game-loader-title" id="loader-title">Launching game</div>
                <div class="game-loader-subtitle">Preparing your experience</div>

                    downX = prevX = e.clientX;
                    downY = prevY = e.clientY;
                    stage.setPointerCapture(e.pointerId);
                }
                );
                stage.addEventListener("pointermove", e => {
                    if (inControls(e))
                        return;
                    if (dragging) {
                        const dx = e.clientX - prevX
                          , dy = e.clientY - prevY;
                        if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4)
                            moved = true;
                        targetRotation.y += dx * .006;
                        targetRotation.x = Math.max(-1.35, Math.min(1.35, targetRotation.x + dy * .006));
                        prevX = e.clientX;
                        prevY = e.clientY;
                    } else if (globeReady)
                        pickAt(e, false);
                }
                );
                stage.addEventListener("pointerup", e => {
                    if (!dragging)
                        return;
                    dragging = false;
                    if (!moved && globeReady)
                        pickAt(e, true);
                }
                );
                stage.addEventListener("pointercancel", () => {
                    dragging = false;
                }
                );
                stage.addEventListener("pointerleave", () => {
                    if (!dragging) {
                        hoveredPin = null;
                        hoverLabel.classList.remove("show");
                    }
                }
                );
                stage.addEventListener("wheel", e => {
                    if (!camera)
                        return;
                    e.preventDefault();
                    camera.position.z = Math.max(2.6, Math.min(6, camera.position.z + e.deltaY * .002));
                }
                , {
                    passive: false
                });

                $("#play").addEventListener("click", () => {
                    const theme = THEMES[selectedMap];
                    launchGame(theme ? THEME_BASE + theme : POKI_URL, "Subway Surfers");
                }
                );
                document.querySelectorAll(".mode").forEach(button => button.addEventListener("click", () => {
                    const mode = button.dataset.mode;
                    if (mode === "multiplayer")
                        launchGame(MULTIPLAYER_URL, "Subway Surfers Multiplayer");
                    if (mode === "horror")
                        launchGame(HORROR_URL, "Subway Suffers");
                }
                ));
            }
            )();
        </script>
    </body>
</html>
